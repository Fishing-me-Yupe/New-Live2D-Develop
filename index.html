<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live2D Tracker & Parameter Debugger (Monochrome)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <!-- MediaPipe Face Mesh Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #f3f4f6;
            touch-action: manipulation;
        }
        .mono-val {
            font-family: 'JetBrains Mono', monospace;
        }
        .header-font {
            font-family: 'Chakra Petch', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #09090b;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 2px;
        }
        /* カメラ映像およびキャンバスを左右反転（鏡像） */
        #outputCanvas {
            transform: scaleX(-1);
            will-change: transform;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between bg-black text-zinc-100 select-none">

    <!-- Top Header -->
    <header class="h-14 border-b border-zinc-800 bg-zinc-950 px-4 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center space-x-2">
            <div class="w-2.5 h-2.5 rounded-full bg-white animate-pulse"></div>
            <h1 class="header-font text-lg font-bold tracking-wider text-white">LIVE2D <span class="text-zinc-500 text-sm font-normal">TRACKER</span></h1>
        </div>
        <div class="flex items-center space-x-3">
            <div id="fpsDisplay" class="mono-val text-xs px-2.5 py-1 bg-zinc-900 border border-zinc-700 rounded text-zinc-300 font-semibold">
                FPS: --
            </div>
            <button id="toggleCameraBtn" class="bg-zinc-100 hover:bg-white text-zinc-950 text-xs px-3.5 py-1.5 rounded-md font-bold transition flex items-center space-x-1.5 shadow-sm">
                <i class="fa-solid fa-camera"></i>
                <span id="camBtnText">起動</span>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 relative flex flex-col md:flex-row overflow-hidden">
        
        <!-- Camera Viewport Canvas Container -->
        <div class="relative flex-1 bg-black flex items-center justify-center overflow-hidden min-h-[260px]">
            <video id="webcam" class="hidden" playsinline muted></video>
            <canvas id="outputCanvas" class="w-full h-full object-contain"></canvas>

            <!-- Status / Loading Banner -->
            <div id="statusOverlay" class="absolute inset-0 bg-black/85 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-10 transition-opacity duration-300">
                <i id="statusIcon" class="fa-solid fa-circle-notch fa-spin text-4xl text-zinc-400 mb-3"></i>
                <p id="statusText" class="text-zinc-300 text-sm font-medium">カメラのアクセスを待機中...</p>
                <button id="startTrackBtn" class="mt-4 bg-white hover:bg-zinc-200 text-black font-bold text-sm py-2 px-6 rounded-md transition border border-zinc-300">
                    トラッキングを開始
                </button>
            </div>

            <!-- Floating Quick Toggle Overlay -->
            <div class="absolute top-3 left-3 flex flex-wrap gap-2 z-10">
                <button id="toggleWireframeBtn" class="bg-zinc-900/90 hover:bg-zinc-800 border border-zinc-700 text-xs px-2.5 py-1.5 rounded text-zinc-200 backdrop-blur-md transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-vector-square text-zinc-400"></i>
                    <span id="wireframeText">メッシュ: ON</span>
                </button>
                <button id="toggleFpsCapBtn" class="bg-zinc-900/90 hover:bg-zinc-800 border border-zinc-700 text-xs px-2.5 py-1.5 rounded text-zinc-300 backdrop-blur-md transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-gauge-high text-zinc-400"></i>
                    <span id="fpsCapText">30 FPS</span>
                </button>
            </div>
        </div>

        <!-- Live Parameters Display Panel -->
        <div class="w-full md:w-80 border-t md:border-t-0 md:border-l border-zinc-800 bg-zinc-950 overflow-y-auto p-3 flex flex-col gap-3 shrink-0 h-[48%] md:h-full">
            
            <div class="text-xs font-bold text-zinc-500 uppercase tracking-wider flex items-center justify-between pb-1 border-b border-zinc-800">
                <span>検出パラメータ (モノクロ)</span>
                <span class="text-[10px] text-zinc-400 font-normal">正規化・角度変換済</span>
            </div>

            <!-- Head Pose Angles (X, Y, Z) Card -->
            <div class="bg-zinc-900/50 rounded-lg p-3 border border-zinc-800">
                <div class="text-xs font-semibold text-zinc-300 mb-2 flex items-center justify-between">
                    <span><i class="fa-solid fa-head-side-virus text-zinc-400 mr-1.5"></i>頭部の向き (0° 〜 180°)</span>
                </div>
                <div class="grid grid-cols-3 gap-2 text-center">
                    <!-- Pitch (Upper: 0, Down: 180) -->
                    <div class="bg-black/60 p-2 rounded border border-zinc-800">
                        <div class="text-[10px] text-zinc-400 font-semibold mb-0.5">X軸 (上下)</div>
                        <div id="valPoseX" class="mono-val text-sm font-bold text-white">90.00°</div>
                        <div class="text-[9px] text-zinc-500 mt-0.5">上0° / 下180°</div>
                    </div>
                    <!-- Yaw (Left: 0, Right: 180) -->
                    <div class="bg-black/60 p-2 rounded border border-zinc-800">
                        <div class="text-[10px] text-zinc-400 font-semibold mb-0.5">Y軸 (左右)</div>
                        <div id="valPoseY" class="mono-val text-sm font-bold text-white">90.00°</div>
                        <div class="text-[9px] text-zinc-500 mt-0.5">左0° / 右180°</div>
                    </div>
                    <!-- Roll (Left: 0, Right: 180) -->
                    <div class="bg-black/60 p-2 rounded border border-zinc-800">
                        <div class="text-[10px] text-zinc-400 font-semibold mb-0.5">Z軸 (傾き)</div>
                        <div id="valPoseZ" class="mono-val text-sm font-bold text-white">90.00°</div>
                        <div class="text-[9px] text-zinc-500 mt-0.5">左0° / 右180°</div>
                    </div>
                </div>
            </div>

            <!-- Eye Openness Card (Independent Left & Right) -->
            <div class="bg-zinc-900/50 rounded-lg p-3 border border-zinc-800">
                <div class="text-xs font-semibold text-zinc-300 mb-2 flex items-center justify-between">
                    <span><i class="fa-solid fa-eye text-zinc-400 mr-1.5"></i>目の開閉度 (独立計測)</span>
                    <span class="text-[9px] text-zinc-500">(縦幅*2 / 横幅)</span>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <!-- Left Eye -->
                    <div class="bg-black/60 p-2.5 rounded border border-zinc-800 flex flex-col justify-between">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[11px] text-zinc-400 font-medium">左目 (Left)</span>
                            <span id="valEyeL" class="mono-val text-sm font-bold text-white">0.00</span>
                        </div>
                        <div class="w-full bg-zinc-800 h-1 rounded overflow-hidden">
                            <div id="barEyeL" class="bg-zinc-200 h-full w-0 transition-all duration-75"></div>
                        </div>
                    </div>
                    <!-- Right Eye -->
                    <div class="bg-black/60 p-2.5 rounded border border-zinc-800 flex flex-col justify-between">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[11px] text-zinc-400 font-medium">右目 (Right)</span>
                            <span id="valEyeR" class="mono-val text-sm font-bold text-white">0.00</span>
                        </div>
                        <div class="w-full bg-zinc-800 h-1 rounded overflow-hidden">
                            <div id="barEyeR" class="bg-zinc-200 h-full w-0 transition-all duration-75"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Mouth Opening & Width Card -->
            <div class="bg-zinc-900/50 rounded-lg p-3 border border-zinc-800">
                <div class="text-xs font-semibold text-zinc-300 mb-2 flex items-center justify-between">
                    <span><i class="fa-solid fa-lips text-zinc-400 mr-1.5"></i>口の形状パラメータ</span>
                    <span class="text-[9px] text-zinc-500">距離補正済</span>
                </div>
                <div class="space-y-2">
                    <!-- Mouth Height -->
                    <div class="bg-black/60 p-2.5 rounded border border-zinc-800">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[11px] text-zinc-400 font-medium">口の開き（縦幅）</span>
                            <span id="valMouthOpen" class="mono-val text-sm font-bold text-white">0.00</span>
                        </div>
                        <div class="w-full bg-zinc-800 h-1 rounded overflow-hidden">
                            <div id="barMouthOpen" class="bg-zinc-200 h-full w-0 transition-all duration-75"></div>
                        </div>
                    </div>
                    <!-- Mouth Width -->
                    <div class="bg-black/60 p-2.5 rounded border border-zinc-800">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[11px] text-zinc-400 font-medium">口の広がり（横幅）</span>
                            <span id="valMouthWidth" class="mono-val text-sm font-bold text-white">0.00</span>
                        </div>
                        <div class="w-full bg-zinc-800 h-1 rounded overflow-hidden">
                            <div id="barMouthWidth" class="bg-zinc-200 h-full w-0 transition-all duration-75"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Distance Scale Info -->
            <div class="bg-zinc-900/30 rounded p-2 border border-zinc-800/80 flex justify-between items-center text-[11px] text-zinc-400">
                <span>顔スケール (距離依存基準):</span>
                <span id="valFaceScale" class="mono-val font-semibold text-zinc-200">1.00</span>
            </div>

        </div>
    </main>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('outputCanvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        const statusOverlay = document.getElementById('statusOverlay');
        const statusText = document.getElementById('statusText');
        const statusIcon = document.getElementById('statusIcon');
        const startTrackBtn = document.getElementById('startTrackBtn');
        const toggleCameraBtn = document.getElementById('toggleCameraBtn');
        const camBtnText = document.getElementById('camBtnText');
        
        const toggleWireframeBtn = document.getElementById('toggleWireframeBtn');
        const wireframeText = document.getElementById('wireframeText');
        const toggleFpsCapBtn = document.getElementById('toggleFpsCapBtn');
        const fpsCapText = document.getElementById('fpsCapText');
        const fpsDisplay = document.getElementById('fpsDisplay');

        const valPoseX = document.getElementById('valPoseX');
        const valPoseY = document.getElementById('valPoseY');
        const valPoseZ = document.getElementById('valPoseZ');
        const valEyeL = document.getElementById('valEyeL');
        const valEyeR = document.getElementById('valEyeR');
        const barEyeL = document.getElementById('barEyeL');
        const barEyeR = document.getElementById('barEyeR');
        const valMouthOpen = document.getElementById('valMouthOpen');
        const valMouthWidth = document.getElementById('valMouthWidth');
        const barMouthOpen = document.getElementById('barMouthOpen');
        const barMouthWidth = document.getElementById('barMouthWidth');
        const valFaceScale = document.getElementById('valFaceScale');

        let isRunning = false;
        let showWireframe = true;
        let targetFps = 30;
        let lastFrameTime = 0;
        let frameCount = 0;
        let lastFpsUpdate = performance.now();
        let faceMesh = null;

        const LM = {
            LEFT_EYE: { top: 159, bottom: 145, left: 33, right: 133 },
            RIGHT_EYE: { top: 386, bottom: 374, left: 362, right: 263 },
            MOUTH: { top: 13, bottom: 14, left: 61, right: 291 },
            FACE_SCALE: { leftEyeOuter: 33, rightEyeOuter: 263 },
            HEAD_POSE: { nose: 1, chin: 152, leftCheek: 234, rightCheek: 454, forehead: 10 }
        };

        function distance(pt1, pt2) {
            const dx = pt1.x - pt2.x;
            const dy = pt1.y - pt2.y;
            const dz = (pt1.z || 0) - (pt2.z || 0);
            return Math.sqrt(dx * dx + dy * dy + dz * dz);
        }

        function clamp(val, min, max) {
            return Math.max(min, Math.min(max, val));
        }

        /*
          頭部回転角度の算出 (0° 〜 180° 表示にマッピング)
          正面 = 90°
        */
        function calculateHeadPose(landmarks) {
            const nose = landmarks[LM.HEAD_POSE.nose];
            const chin = landmarks[LM.HEAD_POSE.chin];
            const forehead = landmarks[LM.HEAD_POSE.forehead];
            const leftCheek = landmarks[LM.HEAD_POSE.leftCheek];
            const rightCheek = landmarks[LM.HEAD_POSE.rightCheek];

            // 1. X軸 (Pitch: 上下) -> 上に行くと0°、下に行くと180°
            const midY = (forehead.y + chin.y) / 2;
            const faceHeight = Math.abs(chin.y - forehead.y) || 1;
            const rawPitch = ((nose.y - midY) / faceHeight) * 180; // 正面付近が0前後
            const pitchDeg = clamp(90 + rawPitch, 0, 180);

            // 鏡像反転を考慮した左右算出
            const distLeft = Math.abs(nose.x - leftCheek.x);
            const distRight = Math.abs(rightCheek.x - nose.x);
            
            // 2. Y軸 (Yaw: 左右) -> 実際の現実の顔が左に行くと0°、右に行くと180°
            const rawYaw = ((distRight - distLeft) / (distLeft + distRight || 1)) * 180;
            const yawDeg = clamp(90 - rawYaw, 0, 180);

            // 3. Z軸 (Roll: 傾き) -> 左に傾けると0°、右に傾けると180°
            const dy = rightCheek.y - leftCheek.y;
            const dx = rightCheek.x - leftCheek.x;
            const rollRad = Math.atan2(dy, dx);
            const rawRoll = rollRad * (180 / Math.PI);
            const rollDeg = clamp(90 - rawRoll, 0, 180);

            return {
                x: pitchDeg,
                y: yawDeg,
                z: rollDeg
            };
        }

        function onResults(results) {
            const now = performance.now();
            frameCount++;
            if (now - lastFpsUpdate >= 1000) {
                const fps = Math.round((frameCount * 1000) / (now - lastFpsUpdate));
                fpsDisplay.textContent = `FPS: ${fps}`;
                frameCount = 0;
                lastFpsUpdate = now;
            }

            if (canvasElement.width !== videoElement.videoWidth || canvasElement.height !== videoElement.videoHeight) {
                canvasElement.width = videoElement.videoWidth || 640;
                canvasElement.height = videoElement.videoHeight || 480;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];

                const eyeDist = distance(landmarks[LM.FACE_SCALE.leftEyeOuter], landmarks[LM.FACE_SCALE.rightEyeOuter]);
                const faceScale = Math.max(0.05, eyeDist);
                valFaceScale.textContent = faceScale.toFixed(2);

                // 0°〜180° 角度の更新
                const pose = calculateHeadPose(landmarks);
                valPoseX.textContent = `${pose.x.toFixed(2)}°`;
                valPoseY.textContent = `${pose.y.toFixed(2)}°`;
                valPoseZ.textContent = `${pose.z.toFixed(2)}°`;

                // 目の開き具合 (縦幅 * 2 / 横幅)
                const leftEyeH = distance(landmarks[LM.LEFT_EYE.top], landmarks[LM.LEFT_EYE.bottom]);
                const leftEyeW = distance(landmarks[LM.LEFT_EYE.left], landmarks[LM.LEFT_EYE.right]) || 0.001;
                const leftEyeOpenRatio = (leftEyeH * 2.0) / leftEyeW;

                const rightEyeH = distance(landmarks[LM.RIGHT_EYE.top], landmarks[LM.RIGHT_EYE.bottom]);
                const rightEyeW = distance(landmarks[LM.RIGHT_EYE.left], landmarks[LM.RIGHT_EYE.right]) || 0.001;
                const rightEyeOpenRatio = (rightEyeH * 2.0) / rightEyeW;

                const eyeLVal = clamp(leftEyeOpenRatio, 0, 1.5);
                const eyeRVal = clamp(rightEyeOpenRatio, 0, 1.5);
                valEyeL.textContent = eyeLVal.toFixed(2);
                valEyeR.textContent = eyeRVal.toFixed(2);
                barEyeL.style.width = `${Math.min(100, (eyeLVal / 1.0) * 100)}%`;
                barEyeR.style.width = `${Math.min(100, (eyeRVal / 1.0) * 100)}%`;

                // 口のサイズ（距離正規化）
                const mouthH = distance(landmarks[LM.MOUTH.top], landmarks[LM.MOUTH.bottom]);
                const mouthW = distance(landmarks[LM.MOUTH.left], landmarks[LM.MOUTH.right]);

                const mouthOpenNorm = clamp((mouthH / faceScale) * 1.8, 0, 1.5);
                const mouthWidthNorm = clamp((mouthW / faceScale) * 0.8, 0, 1.5);

                valMouthOpen.textContent = mouthOpenNorm.toFixed(2);
                valMouthWidth.textContent = mouthWidthNorm.toFixed(2);
                barMouthOpen.style.width = `${Math.min(100, (mouthOpenNorm / 1.0) * 100)}%`;
                barMouthWidth.style.width = `${Math.min(100, (mouthWidthNorm / 0.8) * 100)}%`;

                // メッシュ描画（モノクロ・ホワイト）
                if (showWireframe) {
                    canvasCtx.fillStyle = '#ffffff';
                    const keyPoints = [
                        ...Object.values(LM.LEFT_EYE),
                        ...Object.values(LM.RIGHT_EYE),
                        ...Object.values(LM.MOUTH),
                        ...Object.values(LM.HEAD_POSE)
                    ];

                    for (let i = 0; i < keyPoints.length; i++) {
                        const pt = landmarks[keyPoints[i]];
                        if (pt) {
                            canvasCtx.beginPath();
                            canvasCtx.arc(pt.x * canvasElement.width, pt.y * canvasElement.height, 2, 0, 2 * Math.PI);
                            canvasCtx.fill();
                        }
                    }
                }
            }

            canvasCtx.restore();
        }

        async function initMediaPipe() {
            try {
                statusText.textContent = "MediaPipe FaceMesh を初期化中...";

                faceMesh = new FaceMesh({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
                });

                faceMesh.setOptions({
                    maxNumFaces: 1,
                    refineLandmarks: false,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                faceMesh.onResults(onResults);
                statusText.textContent = "カメラの起動許可を確認中...";
                startTrackingLoop();
            } catch (err) {
                console.error(err);
                statusText.textContent = "初期化エラー: " + err.message;
                statusIcon.className = "fa-solid fa-triangle-exclamation text-4xl text-zinc-500 mb-3";
            }
        }

        async function processVideoFrame() {
            if (!isRunning) return;

            const now = performance.now();
            const elapsed = now - lastFrameTime;
            const interval = 1000 / targetFps;

            if (elapsed >= interval) {
                lastFrameTime = now - (elapsed % interval);
                if (videoElement.readyState >= 2) {
                    await faceMesh.send({ image: videoElement });
                }
            }
            requestAnimationFrame(processVideoFrame);
        }

        async function startTrackingLoop() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "user",
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        frameRate: { ideal: 30 }
                    },
                    audio: false
                });

                videoElement.srcObject = stream;
                await videoElement.play();

                isRunning = true;
                statusOverlay.classList.add('opacity-0', 'pointer-events-none');
                camBtnText.textContent = "停止";
                toggleCameraBtn.classList.replace('bg-zinc-100', 'bg-zinc-800');
                toggleCameraBtn.classList.replace('text-zinc-950', 'text-zinc-100');

                requestAnimationFrame(processVideoFrame);

            } catch (err) {
                console.error(err);
                statusText.textContent = "カメラ接続失敗: アクセスを許可してください";
                statusIcon.className = "fa-solid fa-video-slash text-4xl text-zinc-500 mb-3";
            }
        }

        function stopTracking() {
            isRunning = false;
            if (videoElement.srcObject) {
                videoElement.srcObject.getTracks().forEach(track => track.stop());
                videoElement.srcObject = null;
            }
            statusOverlay.classList.remove('opacity-0', 'pointer-events-none');
            statusText.textContent = "トラッキングは停止しています";
            statusIcon.className = "fa-solid fa-pause text-4xl text-zinc-400 mb-3";
            camBtnText.textContent = "起動";
            toggleCameraBtn.classList.replace('bg-zinc-800', 'bg-zinc-100');
            toggleCameraBtn.classList.replace('text-zinc-100', 'text-zinc-950');
        }

        startTrackBtn.addEventListener('click', () => {
            if (!faceMesh) {
                initMediaPipe();
            } else if (!isRunning) {
                startTrackingLoop();
            }
        });

        toggleCameraBtn.addEventListener('click', () => {
            if (isRunning) {
                stopTracking();
            } else {
                if (!faceMesh) {
                    initMediaPipe();
                } else {
                    startTrackingLoop();
                }
            }
        });

        toggleWireframeBtn.addEventListener('click', () => {
            showWireframe = !showWireframe;
            wireframeText.textContent = `メッシュ: ${showWireframe ? 'ON' : 'OFF'}`;
            toggleWireframeBtn.classList.toggle('text-zinc-200', showWireframe);
            toggleWireframeBtn.classList.toggle('text-zinc-500', !showWireframe);
        });

        toggleFpsCapBtn.addEventListener('click', () => {
            targetFps = targetFps === 30 ? 60 : 30;
            fpsCapText.textContent = `${targetFps} FPS`;
        });
    </script>
</body>
</html>
